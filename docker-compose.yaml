version: "3.9"

services:
  localstack:
    image: localstack/localstack:3.5.0
    container_name: localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=dynamodb
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'

  app:
    build: .
    container_name: flask_app
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
